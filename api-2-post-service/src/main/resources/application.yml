server:
  port: ${PORT:8082}

spring:
  application:
    name: api-2-post-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/posts_db}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jsonplaceholder:
  posts-url: ${JSONPLACEHOLDER_POSTS_URL:https://jsonplaceholder.typicode.com/posts}

management:
  endpoints:
    web:
      exposure:
        include: health,info
